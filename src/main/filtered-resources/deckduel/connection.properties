# The production game server, filled in at build time by Maven resource filtering:
#   mvn package -Ddeckduel.server.host=<public DNS name on the server certificate> -Ddeckduel.server.port=<game port>
# Production connections always use TLS. Empty (the default) means this build has no production
# server, and the client uses the saved setting or the local development server 127.0.0.1:5555.
host=${deckduel.server.host}
port=${deckduel.server.port}
