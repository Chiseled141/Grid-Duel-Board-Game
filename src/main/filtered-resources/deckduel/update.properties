# The release channel, filled in at build time by Maven resource filtering:
#   mvn package -Ddeckduel.update.url=https://<bucket>.s3.<region>.amazonaws.com/<channel>/latest.properties \
#               -Ddeckduel.update.publicKey=<Base64 X.509 Ed25519 public key>
# Both empty (the default) means no release channel is configured and nothing is checked.
metadataUrl=${deckduel.update.url}
publicKey=${deckduel.update.publicKey}
