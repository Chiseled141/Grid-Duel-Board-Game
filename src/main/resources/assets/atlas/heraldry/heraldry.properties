hungary.design=Árpád red and silver stripes on the banner; striped and double-cross halves on the shield.
hungary.scope=Simplified medieval interpretation, not an exact reconstruction of Vladislaus I's personal royal standard.
poland.design=Crowned silver eagle displayed on red.
poland.scope=Medieval royal heraldry.
bohemia.design=Crowned silver lion with two tails on red.
bohemia.scope=Medieval royal heraldry.
austria.design=Red field with a silver horizontal fess (the Bindenschild).
austria.scope=Medieval Bindenschild heraldry.
styria.design=Silver heraldic panther on green, with red horns, claws and flame.
styria.scope=Medieval ducal motif; a simplified artistic drawing, not a facsimile of a particular armorial.
croatia.design=Silver and red checkerboard.
croatia.scope=Later medieval interpretation: the reference is dated 1495, not 1444. The flag is an artistic banner of arms, not a verified national flag of 1444.
transylvania.design=Eagle, sun, crescent and seven towers; blue and gold fields divided by red.
transylvania.scope=Later seventeenth-century interpretation, not a claim about 1444; the red band is recorded on a 1666 thaler. The flag is an artistic banner of arms.
