# Bundled default balance configuration for Grid Duel
# UTF-8 via Properties.load(Reader). Optional override files replace supplied keys only.
config.schemaVersion=1
rules.version=grid-duel-v3
movement.handSize=2
skill.handSize=3
mana.initial=2
mana.income=1
mana.cap=5
turn.limit=60

# 01 - SIDESTEP
skill.sidestep.name=SIDESTEP
skill.sidestep.cost=1
skill.sidestep.copies=1
skill.sidestep.description=Move one friendly piece exactly {distance} square(s) horizontally or vertically to an empty square. Jump over intervening pieces.
skill.sidestep.artwork=assets/medieval/skills/sidestep.png
skill.sidestep.distance=1

# 02 - DASH
skill.dash.name=DASH
skill.dash.cost=2
skill.dash.copies=1
skill.dash.description=Move one friendly piece exactly {distance} square(s) horizontally or vertically. Every traversed square, including the destination, must be empty.
skill.dash.artwork=assets/medieval/skills/dash.png
skill.dash.distance=2

# 03 - BLINK
skill.blink.name=BLINK
skill.blink.cost=3
skill.blink.copies=1
skill.blink.description=Teleport one friendly piece to an empty square within distance {range}. Ignore pieces between.
skill.blink.artwork=assets/medieval/skills/blink.png
skill.blink.range=3

# 04 - EXCHANGE
skill.exchange.name=EXCHANGE
skill.exchange.cost=2
skill.exchange.copies=1
skill.exchange.description=Swap two friendly pieces within distance {range} of each other.
skill.exchange.artwork=assets/medieval/skills/exchange.png
skill.exchange.range=3

# 05 - ADVANCE
skill.advance.name=ADVANCE
skill.advance.cost=3
skill.advance.copies=1
skill.advance.description=Move two different friendly pieces 1 square each toward the enemy starting edge. Both destinations must be empty.
skill.advance.artwork=assets/medieval/skills/advance.png

# 06 - RECALL
skill.recall.name=RECALL
skill.recall.cost=1
skill.recall.copies=1
skill.recall.description=Teleport one friendly piece to any empty square on your starting row.
skill.recall.artwork=assets/medieval/skills/recall.png

# 07 - STRIKE
skill.strike.name=STRIKE
skill.strike.cost=3
skill.strike.copies=1
skill.strike.description=Choose a friendly piece. Eliminate 1 enemy horizontally or vertically adjacent to it. Your piece stays still.
skill.strike.artwork=assets/medieval/skills/strike.png

# 08 - PIERCE
skill.pierce.name=PIERCE
skill.pierce.cost=4
skill.pierce.copies=1
skill.pierce.description=Choose a friendly piece. Eliminate an enemy exactly {distance} square(s) away horizontally or vertically. All intervening squares must be empty.
skill.pierce.artwork=assets/medieval/skills/pierce.png
skill.pierce.distance=2

# 09 - SURROUND
skill.surround.name=SURROUND
skill.surround.cost=2
skill.surround.copies=1
skill.surround.description=Eliminate 1 enemy horizontally or vertically adjacent to at least {requiredAllies} friendly piece(s).
skill.surround.artwork=assets/medieval/skills/surround.png
skill.surround.requiredAllies=2

# 10 - SWEEP
skill.sweep.name=SWEEP
skill.sweep.cost=5
skill.sweep.copies=1
skill.sweep.description=Choose a friendly piece. Eliminate up to {maxTargets} enemies horizontally or vertically adjacent to it.
skill.sweep.artwork=assets/medieval/skills/sweep.png
skill.sweep.maxTargets=2

# 11 - SHOVE
skill.shove.name=SHOVE
skill.shove.cost=1
skill.shove.copies=1
skill.shove.description=Choose a friendly piece. Push an adjacent enemy 1 square directly away. The destination must be empty and on the board.
skill.shove.artwork=assets/medieval/skills/shove.png

# 12 - PULL
skill.pull.name=PULL
skill.pull.cost=1
skill.pull.copies=1
skill.pull.description=Choose a friendly piece. Pull an enemy exactly 2 squares away horizontally or vertically into the empty square between.
skill.pull.artwork=assets/medieval/skills/pull.png

# 13 - VAULT
skill.vault.name=VAULT
skill.vault.cost=2
skill.vault.copies=1
skill.vault.description=Move one friendly piece exactly {distance} square(s) horizontally or vertically to an empty square. You may jump over a piece.
skill.vault.artwork=assets/medieval/skills/vault.png
skill.vault.distance=2

# 14 - FLANK
skill.flank.name=FLANK
skill.flank.cost=3
skill.flank.copies=1
skill.flank.description=Move one friendly piece 1 square diagonally. The destination must be empty or contain an enemy. Eliminate that enemy if present.
skill.flank.artwork=assets/medieval/skills/flank.png

# 15 - TRANSPOSITION
skill.transposition.name=TRANSPOSITION
skill.transposition.cost=4
skill.transposition.copies=1
skill.transposition.description=Swap one friendly piece with one enemy within distance {range}. Neither piece is eliminated.
skill.transposition.artwork=assets/medieval/skills/transposition.png
skill.transposition.range=2

# 16 - GUST
skill.gust.name=GUST
skill.gust.cost=3
skill.gust.copies=1
skill.gust.description=Move up to {maxTargets} enemies 1 square each in the same horizontal or vertical direction. All selected destinations must be empty before the skill.
skill.gust.artwork=assets/medieval/skills/gust.png
skill.gust.maxTargets=2

# 17 - RALLY
skill.rally.name=RALLY
skill.rally.cost=3
skill.rally.copies=1
skill.rally.description=Choose a friendly anchor. Move up to {maxTargets} other friendly pieces 1 square each horizontally or vertically toward it. Each move must reduce distance and land empty.
skill.rally.artwork=assets/medieval/skills/rally.png
skill.rally.maxTargets=2

# 18 - SCATTER
skill.scatter.name=SCATTER
skill.scatter.cost=3
skill.scatter.copies=1
skill.scatter.description=Move up to {maxTargets} different friendly pieces 1 square diagonally each. All selected destinations must be empty before the skill.
skill.scatter.artwork=assets/medieval/skills/scatter.png
skill.scatter.maxTargets=2

# 19 - CROSSFIRE
skill.crossfire.name=CROSSFIRE
skill.crossfire.cost=4
skill.crossfire.copies=1
skill.crossfire.description=Eliminate an enemy between two friendly pieces in one row or column. Each ally must be within distance {range} with no pieces between it and the target.
skill.crossfire.artwork=assets/medieval/skills/crossfire.png
skill.crossfire.range=3

# 20 - CHAIN STRIKE
skill.chain-strike.name=CHAIN STRIKE
skill.chain-strike.cost=5
skill.chain-strike.copies=1
skill.chain-strike.description=Choose a friendly piece. Eliminate an adjacent enemy, then optionally 1 enemy adjacent to the first target. Adjacency is horizontal or vertical.
skill.chain-strike.artwork=assets/medieval/skills/chain-strike.png

# 21 - MANA SURGE
skill.mana-surge.name=MANA SURGE
skill.mana-surge.cost=0
skill.mana-surge.copies=1
skill.mana-surge.description=Gain {manaGain} mana, up to the mana cap. This uses your skill for the turn.
skill.mana-surge.artwork=assets/medieval/skills/mana-surge.png
skill.mana-surge.manaGain=2

# 22 - REFOCUS
skill.refocus.name=REFOCUS
skill.refocus.cost=1
skill.refocus.copies=1
skill.refocus.description=Return both movement cards to the movement deck. Shuffle, then draw 2 movement cards.
skill.refocus.artwork=assets/medieval/skills/refocus.png

# 23 - FORESIGHT
skill.foresight.name=FORESIGHT
skill.foresight.cost=1
skill.foresight.copies=1
skill.foresight.description=Look at the top {lookahead} skill card(s), or all remaining cards if fewer. Return them to the top in any order before drawing your replacement.
skill.foresight.artwork=assets/medieval/skills/foresight.png
skill.foresight.lookahead=3

# 24 - BANISH
skill.banish.name=BANISH
skill.banish.cost=4
skill.banish.copies=1
skill.banish.description=Choose a friendly piece. Send an adjacent enemy to an empty square on that enemy's starting row. Adjacency is horizontal or vertical.
skill.banish.artwork=assets/medieval/skills/banish.png

# Victory target: enemy eliminations + center occupation rewards.
score.target=8
