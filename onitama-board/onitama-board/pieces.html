<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Outfit:wght@400;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="board.css">
<style>
  /* render helper: ?piece=master-red  or  ?board=empty */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body > .ink-piece { display: block; width: 256px; height: 256px; }
  body > .ink-board { margin: 0 12px 12px 0; }
</style>
</head>
<body>
<script src="pieces.js"></script>
<script src="board.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("board")) {
    document.body.appendChild(renderBoard({ pieces: [], cell: 88 }));
  } else {
    const [type, side] = (q.get("piece") || "master-red").split("-");
    document.body.appendChild(renderPiece({ type, side }));
  }
</script>
</body>
</html>
