<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onitama: Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Outfit:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="../onitama-cards/card.css">
<link rel="stylesheet" href="board.css">
<style>html, body { margin: 0; background: #111; }</style>
</head>
<body>
<div class="game" id="game">
  <img class="game__bg" src="../onitama-icons/menu-background.png" alt="">
  <div class="game__shade"></div>

  <!-- left: turn indicator -->
  <aside class="turn panel">
    <div class="turn__who" id="who"><div>Red's<br>turn<small>Your move</small></div></div>
    <div class="panel--dark stats">
      <div><b>07</b><span>Turn</span></div>
      <div><b>0:42</b><span>Clock</span></div>
      <div><b>5</b><span>Red pieces</span></div>
      <div><b>5</b><span>Blue pieces</span></div>
    </div>
    <p class="hint"><b>Student</b> selected. Gold dots mark open squares; the red ring marks a capture.</p>
    <div class="btn-row">
      <button class="btn btn--ghost">Undo</button>
      <button class="btn btn--ghost">Menu</button>
    </div>
    <button class="btn">Resign</button>
  </aside>

  <!-- centre: blue hand / board / red hand -->
  <main class="center-col">
    <div class="hand" id="hand-blue"><div class="tag blue"><i class="pip"></i>Blue · Opponent</div></div>
    <div id="board-host"></div>
    <div class="hand" id="hand-red"><div class="tag red"><i class="pip"></i>Red · You</div></div>
  </main>

  <!-- right: neutral 5th card -->
  <aside class="side-col">
    <div class="next-label panel" style="padding:10px 18px"><b>Next card</b><span>Goes to red</span></div>
    <div id="neutral"></div>
  </aside>
</div>

<script src="../onitama-cards/card.js"></script>
<script src="../onitama-cards/cards-data.js"></script>
<script src="pieces.js"></script>
<script src="board.js"></script>
<script>
  const byId = id => ONITAMA_CARDS.find(c => c.id === id);
  function slot(id, side, active) {
    const s = document.createElement("div");
    s.className = "card-slot" + (active ? " active" : "");
    const c = byId(id);
    s.appendChild(renderCard({ ...c, img: `../onitama-icons/${id}.png`, side }));
    return s;
  }
  // Illustrative mid-opening position: a blue student has advanced to (1,2).
  const pieces = startingPieces().map(p => (p.side === "blue" && p.x === 1 && p.y === 0) ? { ...p, y: 2 } : p);
  document.getElementById("board-host").appendChild(renderBoard({
    pieces,
    selected: [1, 4],
    moveTargets: [[0, 3], [2, 3]],        // Elephant forward diagonals
    captureTargets: [[1, 2]],             // Tiger (0,-2)
    lastMove: [[1, 0], [1, 2]],
    cell: 80,
  }));
  const hb = document.getElementById("hand-blue"), hr = document.getElementById("hand-red");
  hb.prepend(slot("dragon", "blue"), slot("goose", "blue"));
  hr.prepend(slot("tiger", "red", true), slot("elephant", "red", true));
  document.getElementById("neutral").appendChild(slot("crab", "blue"));
  document.getElementById("who").prepend(renderPiece({ type: "master", side: "red" }));
</script>
</body>
</html>
